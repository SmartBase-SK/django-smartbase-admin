{% load i18n %}

<select class="input" data-richtext-text-transform aria-label="{% trans 'Text transform' %}">
    <option value="none">{% trans "Normal case" %}</option>
    <option value="uppercase">{% trans "Uppercase" %}</option>
    <option value="lowercase">{% trans "Lowercase" %}</option>
    <option value="capitalize">{% trans "Capitalize" %}</option>
</select>
